<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de la portada pública — OGPL</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --tinta:#151A22; --granate:#8C1D2F; --oro:#C8A02E;
  --papel:#F2F1EE; --blanco:#fff; --linea:#DDD9D2;
  --texto:#2B2F36; --suave:#6A7079; --rojo:#B3261E; --ambar:#8A6100;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--texto);
  font-family:var(--sans);font-size:15px;line-height:1.55}

/* Barra superior */
.superior{background:var(--tinta);color:#fff;display:flex;align-items:center;
  justify-content:space-between;gap:16px;padding:11px 20px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;border-bottom:3px solid var(--granate)}
.superior h1{font-family:var(--sans);font-size:15px;margin:0;font-weight:700;
  letter-spacing:.02em;text-transform:uppercase}
.superior .sub{font-size:12.5px;color:#A8AEB7;margin:1px 0 0}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:13.5px;border-radius:3px;cursor:pointer;
  padding:8px 14px;border:1px solid transparent;transition:.12s}
.b-principal{background:var(--granate);color:#fff}
.b-principal:hover{background:#751826}
.b-lisa{background:transparent;color:#D7DAE0;border-color:#3C444F}
.b-lisa:hover{background:#232A34;color:#fff}
.b-chico{padding:4px 9px;font-size:12px;background:var(--blanco);
  border-color:var(--linea);color:var(--texto)}
.b-chico:hover{border-color:var(--granate);color:var(--granate)}
.b-quitar:hover{border-color:var(--rojo);color:var(--rojo)}

/* Dos columnas */
.tablero{display:grid;grid-template-columns:minmax(380px,460px) 1fr;
  height:calc(100vh - 56px)}
@media(max-width:960px){.tablero{grid-template-columns:1fr;height:auto}}

.columna-form{overflow-y:auto;padding:22px;border-right:1px solid var(--linea);
  background:var(--papel)}
.columna-vista{background:#5B6068;display:flex;flex-direction:column;overflow:hidden}
@media(max-width:960px){.columna-vista{height:75vh}}

/* Secciones del formulario */
details.seccion{background:var(--blanco);border:1px solid var(--linea);border-radius:3px;
  margin-bottom:12px;overflow:hidden}
details.seccion>summary{cursor:pointer;padding:13px 16px;font-family:var(--sans);
  font-weight:600;font-size:14px;color:var(--tinta);list-style:none;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
details.seccion>summary::-webkit-details-marker{display:none}
details.seccion>summary::after{content:'▸';color:var(--suave);font-size:13px;transition:.15s}
details.seccion[open]>summary::after{transform:rotate(90deg)}
details.seccion[open]>summary{border-bottom:1px solid var(--linea)}
.cuerpo{padding:16px}

label.campo{display:block;margin-bottom:14px}
label.campo:last-child{margin-bottom:0}
.campo>span{display:block;font-size:12.5px;font-weight:600;color:var(--suave);
  margin-bottom:5px;letter-spacing:.01em}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:14px;
  padding:8px 10px;border:1px solid var(--linea);border-radius:3px;background:#FCFCFB;
  color:var(--texto);resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--granate);
  box-shadow:0 0 0 3px rgba(140,29,47,.10);background:#fff}
textarea{min-height:70px;line-height:1.5}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pista{font-size:12px;color:var(--suave);margin-top:4px}

/* Fichas de lista */
.ficha{border:1px solid var(--linea);border-left:3px solid var(--granate);
  border-radius:3px;padding:13px;margin-bottom:11px;background:#FCFCFB}
.ficha-cabeza{display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:11px}
.ficha-cabeza b{font-family:var(--mono);font-size:11.5px;
  color:var(--granate);letter-spacing:.06em;text-transform:uppercase}
.ficha-botones{display:flex;gap:5px}

/* Vista previa */
.vista-barra{background:#3E434B;color:#C9CED6;padding:8px 14px;font-size:12.5px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.vista-barra .anchos{display:flex;gap:5px}
.vista-barra button{padding:3px 10px;font-size:12px;background:transparent;
  border:1px solid #545A63;color:#C9CED6}
.vista-barra button.activo{background:#C9CED6;color:#2B2F36;border-color:#C9CED6}
.marco{flex:1;display:flex;justify-content:center;overflow:auto;padding:14px}
iframe{background:#fff;border:0;width:100%;height:100%;box-shadow:0 4px 20px rgba(0,0,0,.28)}

/* Revisión */
.revision{margin-bottom:12px;border-radius:3px;border:1px solid var(--linea);
  background:var(--blanco);overflow:hidden}
.revision-cabeza{padding:12px 16px;font-family:var(--sans);font-weight:600;
  font-size:14px;display:flex;align-items:center;gap:9px}
.revision.limpia .revision-cabeza{color:#1E5A3C;background:#EAF5EF}
.revision.sucia .revision-cabeza{color:var(--rojo);background:#FCECEA}
.reparo{padding:11px 16px;border-top:1px solid var(--linea);font-size:13px;
  cursor:pointer;transition:background .12s}
.reparo:hover{background:#FAF8F6}
.reparo:focus-visible{outline:2px solid var(--granate);outline-offset:-2px}
.reparo:hover .donde{color:var(--granate)}
.reparo .tit{font-weight:600;display:flex;gap:8px;align-items:center}
.sello{font-size:10px;font-family:var(--mono);letter-spacing:.07em;
  padding:1px 6px;border-radius:2px;text-transform:uppercase;font-weight:600}
.sello.alta{background:#FCECEA;color:var(--rojo);border:1px solid #F0C4BF}
.sello.media{background:#FDF4E3;color:var(--ambar);border:1px solid #EBD9AE}
.reparo .donde{font-family:var(--mono);font-size:11.5px;color:var(--suave);margin-top:3px}
.reparo .por{color:var(--texto);margin-top:4px}
.reparo .cita{margin-top:5px;padding:6px 9px;background:var(--papel);border-radius:2px;
  font-size:12.5px;color:var(--suave);border-left:2px solid var(--linea)}

.aviso-guardado{font-size:12px;color:#A8AEB7}

/* Pestañas de modo */
.pestanas{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--linea)}
.pestanas button{background:transparent;border:0;border-bottom:2px solid transparent;
  border-radius:0;padding:9px 14px;color:var(--suave);font-family:var(--sans);
  font-size:13.5px}
.pestanas button:hover{color:var(--texto)}
.pestanas button.activo{color:var(--granate);border-bottom-color:var(--granate)}

/* Editor de tablas */
.tabla-ed{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.tabla-ed th,.tabla-ed td{border:1px solid var(--linea);padding:0;vertical-align:middle}
.tabla-ed th{background:#EFEDE8}
.tabla-ed input{border:0;border-radius:0;background:transparent;padding:6px 7px;font-size:13px}
.tabla-ed th input{font-weight:600;font-family:var(--sans)}
.tabla-ed input:focus{box-shadow:inset 0 0 0 2px rgba(140,29,47,.35);background:#fff}
.tabla-ed .mando{width:26px;text-align:center;background:var(--papel)}
.tabla-ed .mando button{width:100%;border:0;background:transparent;color:#A6ADB5;
  padding:5px 0;font-size:12px;border-radius:0}
.tabla-ed .mando button:hover{color:var(--rojo);background:#FCECEA}
.tabla-botones{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--suave);font-weight:600;margin:14px 0 7px}
.vineta{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.vineta input{flex:1}
.vineta button{flex:none;padding:5px 9px;font-size:12px;background:var(--blanco);
  border:1px solid var(--linea);color:var(--suave)}
.vineta button:hover{border-color:var(--rojo);color:var(--rojo)}
dialog{border:1px solid var(--linea);border-radius:4px;padding:0;max-width:min(760px,92vw);
  width:100%;box-shadow:0 16px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(21,26,34,.55)}
.dlg-cabeza{padding:14px 18px;border-bottom:1px solid var(--linea);
  font-family:var(--sans);font-weight:600;display:flex;
  justify-content:space-between;align-items:center;gap:12px}
.dlg-cuerpo{padding:18px;max-height:62vh;overflow:auto}
.dlg-cuerpo textarea{min-height:340px;font-family:var(--mono);font-size:12.5px}
</style>
</head>
<body>

<div class="superior">
  <div>
    <h1>Editor de la portada pública</h1>
    <p class="sub">Lo que usted edite aquí es exactamente lo que verán las facultades.</p>
  </div>
  <div class="acciones">
    <span class="aviso-guardado" id="avisoGuardado"></span>
    <button class="b-lisa" id="btnCargar">Cargar index.html</button>
    <button class="b-lisa" id="btnJson">Ver JSON</button>
    <button class="b-lisa" id="btnRestaurar">Restaurar base</button>
    <button class="b-principal" id="btnPublicar">Descargar las 2 páginas</button>
  </div>
</div>

<div class="tablero">
  <div class="columna-form">
    <div class="pestanas">
      <button data-modo="portada" class="activo">Portada</button>
      <button data-modo="plan">Plan de Gestión</button>
    </div>
    <div id="revision"></div>
    <div id="formulario"></div>
  </div>

  <div class="columna-vista">
    <div class="vista-barra">
      <span id="rotuloVista">Vista previa — así se publica</span>
      <div class="anchos">
        <button data-ancho="100%" class="activo">Escritorio</button>
        <button data-ancho="820px">Tableta</button>
        <button data-ancho="390px">Teléfono</button>
      </div>
    </div>
    <div class="marco"><iframe id="vista" title="Vista previa de la portada"></iframe></div>
  </div>
</div>

<input type="file" id="archivo" accept=".html,text/html" hidden>

<dialog id="dlgJson">
  <div class="dlg-cabeza">
    <span>Contenido en JSON</span>
    <div style="display:flex;gap:8px">
      <button class="b-chico" id="btnCopiarJson">Copiar</button>
      <button class="b-chico" id="btnAplicarJson">Aplicar cambios</button>
      <button class="b-chico" id="btnCerrarJson">Cerrar</button>
    </div>
  </div>
  <div class="dlg-cuerpo"><textarea id="areaJson" spellcheck="false"></textarea></div>
</dialog>

<script src="portada.js"></script>
<script>
/**
 * ═══════════════════════════════════════════════════════════════════════════
 *  EDITOR DE LA PORTADA PÚBLICA
 *
 *  Trabaja sobre un único objeto `estado`. Cada tecla que usted pulsa lo
 *  modifica y vuelve a dibujar la vista previa; el formulario NO se redibuja
 *  al escribir, de modo que el cursor nunca salta.
 *
 *  El borrador se guarda solo, en este navegador. Nada viaja a ningún
 *  servidor: la publicación consiste en descargar el index.html y subirlo.
 * ═══════════════════════════════════════════════════════════════════════════
 */

const LLAVE_BORRADOR = 'ogpl.portada.borrador';

let estado = cargarBorrador() || clonar(CONTENIDO_BASE);

/** Qué página se está editando: 'portada' o 'plan'. */
let modo = 'portada';

function clonar(o){ return JSON.parse(JSON.stringify(o)); }

function cargarBorrador(){
  try{
    const crudo = localStorage.getItem(LLAVE_BORRADOR);
    return crudo ? JSON.parse(crudo) : null;
  }catch(e){ return null; }
}

let temporizadorGuardado;
function guardarBorrador(){
  clearTimeout(temporizadorGuardado);
  temporizadorGuardado = setTimeout(function(){
    try{
      localStorage.setItem(LLAVE_BORRADOR, JSON.stringify(estado));
      const hora = new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('avisoGuardado').textContent = 'Borrador guardado ' + hora;
    }catch(e){
      document.getElementById('avisoGuardado').textContent = 'No se pudo guardar el borrador';
    }
  }, 400);
}

/* ── acceso por ruta: 'portada.titulo', 'indicadores.2.valor' ── */
function leer(obj, ruta){
  return ruta.split('.').reduce(function(o,k){ return o == null ? o : o[k]; }, obj);
}
function fijar(obj, ruta, valor){
  const partes = ruta.split('.');
  const ultima = partes.pop();
  const destino = partes.reduce(function(o,k){ return o[k]; }, obj);
  destino[ultima] = valor;
}

/* ───────────────────────── construcción del formulario ───────────────────────── */

function campoTexto(ruta, etiqueta, pista){
  const v = leer(estado, ruta);
  return '<label class="campo"><span>' + etiqueta + '</span>' +
    '<input type="text" data-ruta="' + ruta + '" value="' + escAtr(v) + '">' +
    (pista ? '<div class="pista">' + pista + '</div>' : '') + '</label>';
}
function campoArea(ruta, etiqueta, pista){
  const v = leer(estado, ruta);
  return '<label class="campo"><span>' + etiqueta + '</span>' +
    '<textarea data-ruta="' + ruta + '">' + escTxt(v) + '</textarea>' +
    (pista ? '<div class="pista">' + pista + '</div>' : '') + '</label>';
}
function campoNumero(ruta, etiqueta){
  const v = leer(estado, ruta);
  return '<label class="campo"><span>' + etiqueta + '</span>' +
    '<input type="number" min="0" step="1" data-ruta="' + ruta + '" data-tipo="numero" value="' +
    escAtr(v) + '"></label>';
}
function escAtr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escTxt(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function seccion(id, titulo, contenidoHtml, abierta){
  return '<details class="seccion"' + (abierta ? ' open' : '') + ' data-id="' + id + '">' +
    '<summary>' + titulo + '</summary><div class="cuerpo">' + contenidoHtml + '</div></details>';
}

function botonesFicha(lista, i, total){
  return '<div class="ficha-botones">' +
    '<button class="b-chico" data-mover="' + lista + '" data-i="' + i + '" data-d="-1"' +
      (i === 0 ? ' disabled' : '') + ' title="Subir">↑</button>' +
    '<button class="b-chico" data-mover="' + lista + '" data-i="' + i + '" data-d="1"' +
      (i === total - 1 ? ' disabled' : '') + ' title="Bajar">↓</button>' +
    '<button class="b-chico b-quitar" data-quitar="' + lista + '" data-i="' + i + '" title="Quitar">✕</button>' +
  '</div>';
}

/** Los controles de una viñeta suelta dentro de un apartado del plan. */
function campoVineta(ruta, i, total){
  return '<div class="vineta">' +
    '<input type="text" data-ruta="' + ruta + '.' + i + '" value="' +
      escAtr(leer(estado, ruta + '.' + i)) + '">' +
    '<button data-mover="' + ruta + '" data-i="' + i + '" data-d="-1"' +
      (i === 0 ? ' disabled' : '') + ' title="Subir">↑</button>' +
    '<button data-mover="' + ruta + '" data-i="' + i + '" data-d="1"' +
      (i === total - 1 ? ' disabled' : '') + ' title="Bajar">↓</button>' +
    '<button data-quitar-simple="' + ruta + '" data-i="' + i + '" title="Quitar">✕</button>' +
  '</div>';
}

/**
 * El editor de una tabla: una rejilla de casillas, más los mandos para quitar
 * una fila o una columna. Se edita con la misma forma que tendrá al publicarse,
 * que es más claro que una lista de valores separados por comas.
 */
function editorTabla(ruta){
  const t = leer(estado, ruta);
  if (!t) {
    return '<div class="tabla-botones">' +
      '<button class="b-chico" data-tabla-nueva="' + ruta + '">+ Añadir una tabla</button></div>';
  }
  const enc = t.encabezados || [];
  const filas = t.filas || [];

  let html = '<table class="tabla-ed"><thead><tr>';
  enc.forEach(function(h,c){
    html += '<th><input type="text" data-ruta="' + ruta + '.encabezados.' + c + '" value="' +
      escAtr(h) + '"></th>';
  });
  html += '<th class="mando"></th></tr>' +
    '<tr>' + enc.map(function(_,c){
      return '<th class="mando"><button data-quitar-col="' + ruta + '" data-c="' + c +
             '" title="Quitar la columna">✕</button></th>';
    }).join('') + '<th class="mando"></th></tr></thead><tbody>';

  filas.forEach(function(f,r){
    html += '<tr>';
    enc.forEach(function(_,c){
      html += '<td><input type="text" data-ruta="' + ruta + '.filas.' + r + '.' + c +
              '" value="' + escAtr((f || [])[c]) + '"></td>';
    });
    html += '<td class="mando"><button data-quitar-fila="' + ruta + '" data-r="' + r +
            '" title="Quitar la fila">✕</button></td></tr>';
  });
  html += '</tbody></table>' +
    '<div class="tabla-botones">' +
      '<button class="b-chico" data-fila-nueva="' + ruta + '">+ Fila</button>' +
      '<button class="b-chico" data-col-nueva="' + ruta + '">+ Columna</button>' +
      '<button class="b-chico b-quitar" data-tabla-fuera="' + ruta + '">Quitar la tabla</button>' +
    '</div>';
  return html;
}

/** El formulario del Plan de Gestión. */
function formularioPlan(){
  const aps = (estado.plan && estado.plan.apartados) || [];

  const cabecera = seccion('plan-cabecera', 'Cabecera del documento',
    campoTexto('plan.titulo', 'Título') +
    campoArea('plan.bajada', 'Bajada') +
    '<div class="par">' +
      campoTexto('plan.version', 'Versión') +
      campoTexto('plan.aprobacion', 'Aprobado por') +
    '</div>', true);

  const cuerpo = aps.map(function(a,i){
    const raiz = 'plan.apartados.' + i;
    const vin = a.lista || [];
    return '<div class="ficha">' +
      '<div class="ficha-cabeza"><b>Apartado ' + (i+1) + '</b>' +
        botonesFicha('plan.apartados', i, aps.length) + '</div>' +
      campoTexto(raiz + '.titulo', 'Título del apartado') +
      campoArea(raiz + '.cuerpo', 'Párrafos',
                'Una línea en blanco separa un párrafo del siguiente.') +
      '<div class="sub">Viñetas</div>' +
      vin.map(function(_,j){ return campoVineta(raiz + '.lista', j, vin.length); }).join('') +
      '<button class="b-chico" data-agregar-simple="' + raiz + '.lista">+ Añadir viñeta</button>' +
      '<div class="sub">Tabla</div>' +
      editorTabla(raiz + '.tabla') +
    '</div>';
  }).join('');

  return cabecera +
    seccion('plan-apartados', 'Apartados (' + aps.length + ')',
      cuerpo + '<button class="b-chico" data-agregar="plan.apartados">+ Añadir apartado</button>',
      true);
}

function formularioPortada(){
  const ind = estado.indicadores || [];
  const docs = (estado.documentos && estado.documentos.lista) || [];

  const htmlIndicadores = ind.map(function(k,i){
    return '<div class="ficha">' +
      '<div class="ficha-cabeza"><b>Indicador ' + (i+1) + '</b>' + botonesFicha('indicadores', i, ind.length) + '</div>' +
      '<div class="par">' +
        campoTexto('indicadores.' + i + '.valor', 'Cifra', 'Ej.: 63% · 2 823') +
        campoTexto('indicadores.' + i + '.etiqueta', 'Etiqueta') +
      '</div>' +
      campoTexto('indicadores.' + i + '.detalle', 'Detalle') +
    '</div>';
  }).join('') +
  '<button class="b-chico" data-agregar="indicadores">+ Añadir indicador</button>';

  const htmlDocs = docs.map(function(d,i){
    return '<div class="ficha">' +
      '<div class="ficha-cabeza"><b>Documento ' + (i+1) + '</b>' + botonesFicha('documentos.lista', i, docs.length) + '</div>' +
      '<div class="par">' +
        campoTexto('documentos.lista.' + i + '.etiqueta', 'Cintillo', 'Ej.: Instructivo') +
        campoTexto('documentos.lista.' + i + '.titulo', 'Título') +
      '</div>' +
      campoArea('documentos.lista.' + i + '.descripcion', 'Descripción') +
      // Una tarjeta que apunta a una página del propio sitio no lleva enlace
      // externo: ofrecer el campo invitaría a escribir en algo que no se usa.
      (d.pagina
        ? '<div class="pista">Abre <b>' + escTxt(d.pagina) + '</b>, una página de este ' +
          'mismo sitio. Su contenido se edita en la pestaña «Plan de Gestión».</div>'
        : campoTexto('documentos.lista.' + i + '.enlace', 'Enlace',
            'Debe empezar por https:// · vacío = «pendiente de publicación»')) +
    '</div>';
  }).join('') +
  '<button class="b-chico" data-agregar="documentos.lista">+ Añadir documento</button>';

  return seccion('portada', 'Encabezado y título',
      campoTexto('portada.titulo', 'Título principal') +
      campoArea('portada.bajada', 'Bajada', 'Dos o tres líneas. Es lo primero que se lee.') +
      campoTexto('portada.periodo', 'Fecha de corte'), true) +

    seccion('indicadores', 'Indicadores (' + ind.length + ')', htmlIndicadores, true) +

    seccion('avance', 'Barra de avance',
      campoTexto('avance.titulo', 'Título de la sección') +
      '<div class="par">' +
        campoNumero('avance.conformes', 'Conformes') +
        campoNumero('avance.observados', 'Observados') +
      '</div>' +
      campoNumero('avance.pendientes', 'Pendientes') +
      '<div class="pista" id="sumaAvance"></div>' +
      campoArea('avance.nota', 'Nota al pie del panel')) +

    seccion('documentos', 'Documentos (' + docs.length + ')',
      campoTexto('documentos.titulo', 'Título de la sección') +
      campoArea('documentos.bajada', 'Bajada de la sección') +
      '<hr style="border:0;border-top:1px solid var(--linea);margin:16px 0">' +
      htmlDocs) +

    seccion('aviso', 'Aviso a las facultades',
      campoTexto('aviso.titulo', 'Título del aviso') +
      campoArea('aviso.texto', 'Texto del aviso')) +

    seccion('institucion', 'Institución y pie',
      campoTexto('institucion.universidad', 'Universidad') +
      campoTexto('institucion.oficina', 'Oficina') +
      campoTexto('institucion.sello', 'Sello') +
      '<hr style="border:0;border-top:1px solid var(--linea);margin:16px 0">' +
      campoTexto('pie.contacto', 'Correo de contacto') +
      campoTexto('pie.actualizado', 'Fecha de actualización'));
}

function pintarFormulario(){
  document.getElementById('formulario').innerHTML =
    modo === 'plan' ? formularioPlan() : formularioPortada();

  document.querySelectorAll('.pestanas button').forEach(function(b){
    b.classList.toggle('activo', b.dataset.modo === modo);
  });
  document.getElementById('rotuloVista').textContent = modo === 'plan'
    ? 'Vista previa de plan.html — así se publica'
    : 'Vista previa de index.html — así se publica';

  actualizarSuma();
}

function actualizarSuma(){
  const nodo = document.getElementById('sumaAvance');
  if (!nodo) return;
  const a = estado.avance || {};
  const total = (+a.conformes||0) + (+a.observados||0) + (+a.pendientes||0);
  const pct = total ? Math.round((+a.conformes||0) * 100 / total) : 0;
  // `miles` es la misma función con que la página escribe sus cifras: la pista
  // debe separar los millares igual que el archivo publicado, no de otro modo.
  nodo.textContent = 'Suman ' + miles(total) +
    ' productos · el avance mostrado será ' + pct + '%';
}

/* ───────────────────────── vista previa y revisión ───────────────────────── */

let temporizadorVista;
function refrescarVista(){
  clearTimeout(temporizadorVista);
  temporizadorVista = setTimeout(function(){
    document.getElementById('vista').srcdoc =
      modo === 'plan' ? paginaPlan(estado) : paginaCompleta(estado);
  }, 220);
}

function refrescarRevision(){
  const reparos = revisarAntesDePublicar(estado);
  const caja = document.getElementById('revision');

  if (!reparos.length){
    caja.className = 'revision limpia';
    caja.innerHTML = '<div class="revision-cabeza">✓ Revisión sin reparos — puede publicarse</div>';
    return;
  }

  const graves = reparos.filter(function(r){ return r.gravedad === 'alta'; }).length;
  caja.className = 'revision sucia';
  caja.innerHTML =
    '<div class="revision-cabeza">⚠ ' + reparos.length + ' reparo' + (reparos.length>1?'s':'') +
      ' antes de publicar' + (graves ? ' · ' + graves + ' de atención inmediata' : '') + '</div>' +
    reparos.map(function(r){
      return '<div class="reparo" data-ir="' + escAtr(r.ruta || '') + '" ' +
             'title="Ir al campo" role="button" tabindex="0">' +
        '<div class="tit"><span class="sello ' + r.gravedad + '">' + r.gravedad + '</span>' + r.nombre + '</div>' +
        '<div class="donde">' + r.campo + ' →</div>' +
        '<div class="por">' + r.motivo + '</div>' +
        '<div class="cita">' + escTxt(r.extracto) + '</div>' +
      '</div>';
    }).join('');
}

/** Todo lo que hay que rehacer tras un cambio de contenido. */
function tras(cambioEstructural){
  if (cambioEstructural) pintarFormulario();
  refrescarVista();
  refrescarRevision();
  guardarBorrador();
}

/**
 * Lleva al usuario hasta el campo que causó un reparo.
 *
 * Sin esto la revisión dice qué está mal pero deja buscando dónde: el campo
 * puede estar dentro de una sección plegada y no verse en absoluto.
 */
function irAlCampo(ruta){
  if (!ruta) return;

  // Un reparo puede señalar un campo de la otra página; cambiar de pestaña es
  // parte de llevar al usuario hasta él.
  const destino = ruta.indexOf('plan.') === 0 ? 'plan' : 'portada';
  if (destino !== modo){ modo = destino; pintarFormulario(); refrescarVista(); }

  const control = document.querySelector('[data-ruta="' + ruta.replace(/"/g,'\\"') + '"]');
  if (!control) return;

  const seccion = control.closest('details.seccion');
  if (seccion) seccion.open = true;

  control.scrollIntoView({ behavior:'smooth', block:'center' });
  control.focus({ preventScroll:true });

  // Un parpadeo breve: al abrirse una sección entera, el borde de foco solo
  // no basta para localizar el campo entre los demás.
  control.animate(
    [{ boxShadow:'0 0 0 3px rgba(140,29,47,.55)' },
     { boxShadow:'0 0 0 3px rgba(140,29,47,0)' }],
    { duration: 1100, easing: 'ease-out' }
  );
}

/* ───────────────────────────── eventos ───────────────────────────── */

document.getElementById('revision').addEventListener('click', function(ev){
  const r = ev.target.closest('.reparo');
  if (r) irAlCampo(r.dataset.ir);
});
document.getElementById('revision').addEventListener('keydown', function(ev){
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const r = ev.target.closest('.reparo');
  if (r){ ev.preventDefault(); irAlCampo(r.dataset.ir); }
});

// Escribir: actualiza el estado sin redibujar el formulario (el cursor se queda).
document.getElementById('formulario').addEventListener('input', function(ev){
  const campo = ev.target.closest('[data-ruta]');
  if (!campo) return;
  const valor = campo.dataset.tipo === 'numero' ? (Number(campo.value) || 0) : campo.value;
  fijar(estado, campo.dataset.ruta, valor);
  actualizarSuma();
  refrescarVista();
  refrescarRevision();
  guardarBorrador();
});

// Añadir, quitar y reordenar: sí redibujan.
document.getElementById('formulario').addEventListener('click', function(ev){
  const b = ev.target.closest('button');
  if (!b) return;

  if (b.dataset.agregar){
    ev.preventDefault();
    const lista = leer(estado, b.dataset.agregar);
    lista.push(
      b.dataset.agregar === 'indicadores'
        ? { valor:'0', etiqueta:'Nuevo indicador', detalle:'' }
      : b.dataset.agregar === 'plan.apartados'
        ? { titulo:'Nuevo apartado', cuerpo:'', lista:[], tabla:null }
        : { etiqueta:'', titulo:'Nuevo documento', descripcion:'', enlace:'' });
    tras(true);
    return;
  }

  if (b.dataset.quitar){
    ev.preventDefault();
    const lista = leer(estado, b.dataset.quitar);
    const i = +b.dataset.i;
    const nombre = (lista[i] && (lista[i].titulo || lista[i].etiqueta)) || 'este elemento';
    if (confirm('¿Quitar «' + nombre + '»?')){ lista.splice(i,1); tras(true); }
    return;
  }

  // Viñetas: listas de cadenas sueltas, sin ficha propia.
  if (b.dataset.agregarSimple){
    ev.preventDefault();
    leer(estado, b.dataset.agregarSimple).push('');
    tras(true);
    return;
  }
  if (b.dataset.quitarSimple){
    ev.preventDefault();
    leer(estado, b.dataset.quitarSimple).splice(+b.dataset.i, 1);
    tras(true);
    return;
  }

  // Tablas.
  if (b.dataset.tablaNueva){
    ev.preventDefault();
    fijar(estado, b.dataset.tablaNueva,
      { encabezados:['Columna 1','Columna 2'], filas:[['',''],['','']] });
    tras(true);
    return;
  }
  if (b.dataset.tablaFuera){
    ev.preventDefault();
    if (confirm('¿Quitar la tabla entera de este apartado?')){
      fijar(estado, b.dataset.tablaFuera, null);
      tras(true);
    }
    return;
  }
  if (b.dataset.filaNueva){
    ev.preventDefault();
    const t = leer(estado, b.dataset.filaNueva);
    t.filas.push(t.encabezados.map(function(){ return ''; }));
    tras(true);
    return;
  }
  if (b.dataset.colNueva){
    ev.preventDefault();
    const t = leer(estado, b.dataset.colNueva);
    t.encabezados.push('Columna ' + (t.encabezados.length + 1));
    t.filas.forEach(function(f){ f.push(''); });
    tras(true);
    return;
  }
  if (b.dataset.quitarFila){
    ev.preventDefault();
    leer(estado, b.dataset.quitarFila).filas.splice(+b.dataset.r, 1);
    tras(true);
    return;
  }
  if (b.dataset.quitarCol){
    ev.preventDefault();
    const t = leer(estado, b.dataset.quitarCol);
    if (t.encabezados.length <= 1){
      alert('Una tabla necesita al menos una columna. Quite la tabla entera si ya no hace falta.');
      return;
    }
    const c = +b.dataset.c;
    t.encabezados.splice(c, 1);
    t.filas.forEach(function(f){ f.splice(c, 1); });
    tras(true);
    return;
  }

  if (b.dataset.mover){
    ev.preventDefault();
    const lista = leer(estado, b.dataset.mover);
    const i = +b.dataset.i, j = i + (+b.dataset.d);
    if (j < 0 || j >= lista.length) return;
    const t = lista[i]; lista[i] = lista[j]; lista[j] = t;
    tras(true);
  }
});

// Anchos de la vista previa.
document.querySelector('.vista-barra .anchos').addEventListener('click', function(ev){
  const b = ev.target.closest('button');
  if (!b) return;
  document.querySelectorAll('.vista-barra .anchos button')
    .forEach(function(x){ x.classList.toggle('activo', x === b); });
  document.getElementById('vista').style.width = b.dataset.ancho;
});

document.querySelector('.pestanas').addEventListener('click', function(ev){
  const b = ev.target.closest('button');
  if (!b || b.dataset.modo === modo) return;
  modo = b.dataset.modo;
  pintarFormulario();
  refrescarVista();
});

/* ── Publicar ── */
document.getElementById('btnPublicar').addEventListener('click', function(){
  const reparos = revisarAntesDePublicar(estado);
  const graves = reparos.filter(function(r){ return r.gravedad === 'alta'; });

  if (graves.length){
    const detalle = graves.map(function(r){ return '· ' + r.nombre + ' (' + r.campo + ')'; }).join('\n');
    if (!confirm('La revisión encontró ' + graves.length + ' reparo(s) de atención inmediata:\n\n' +
                 detalle + '\n\nEsta página la verán todas las facultades. ¿Descargar igualmente?')) return;
  }

  // Las dos páginas se publican juntas: la portada enlaza al plan y el plan
  // vuelve a la portada, así que bajar solo una dejaría un enlace roto.
  descargar('index.html', paginaCompleta(estado));
  setTimeout(function(){ descargar('plan.html', paginaPlan(estado)); }, 500);
});

function descargar(nombre, html){
  const enlace = document.createElement('a');
  const url = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
  enlace.href = url;
  enlace.download = nombre;
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ── Cargar un index.html publicado para seguir editándolo ── */
document.getElementById('btnCargar').addEventListener('click', function(){
  document.getElementById('archivo').click();
});
document.getElementById('archivo').addEventListener('change', function(ev){
  const f = ev.target.files[0];
  if (!f) return;
  const lector = new FileReader();
  lector.onload = function(){
    const recuperado = leerContenido(lector.result);
    if (!recuperado){
      alert('Ese archivo no lleva el registro de contenido.\n\n' +
            'Solo se pueden reabrir los index.html generados por este editor.');
      return;
    }
    estado = recuperado;
    tras(true);
    alert('Contenido cargado. Ya puede editarlo.');
  };
  lector.readAsText(f);
  ev.target.value = '';
});

/* ── JSON ── */
const dlg = document.getElementById('dlgJson');
document.getElementById('btnJson').addEventListener('click', function(){
  document.getElementById('areaJson').value = JSON.stringify(estado, null, 2);
  dlg.showModal();
});
document.getElementById('btnCerrarJson').addEventListener('click', function(){ dlg.close(); });
document.getElementById('btnCopiarJson').addEventListener('click', function(){
  navigator.clipboard.writeText(document.getElementById('areaJson').value)
    .then(function(){ alert('JSON copiado.'); })
    .catch(function(){ alert('No se pudo copiar; seleccione el texto y cópielo a mano.'); });
});
document.getElementById('btnAplicarJson').addEventListener('click', function(){
  try{
    estado = JSON.parse(document.getElementById('areaJson').value);
    tras(true);
    dlg.close();
  }catch(e){
    alert('El JSON tiene un error de sintaxis:\n\n' + e.message);
  }
});

/* ── Restaurar ── */
document.getElementById('btnRestaurar').addEventListener('click', function(){
  if (!confirm('Se descartará todo lo que haya editado y volverá al contenido base. ¿Continuar?')) return;
  estado = clonar(CONTENIDO_BASE);
  tras(true);
});

/* ── Arranque ── */
pintarFormulario();
document.getElementById('vista').srcdoc = paginaCompleta(estado);
refrescarRevision();
</script>
